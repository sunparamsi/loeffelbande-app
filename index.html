<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2814a" />
    <meta name="description" content="Rezepte inventarisieren, katalogisieren, Vorrat & Einkaufsliste verwalten" />
    <title>Löffelbande</title>
    <!-- Setzt data-theme so früh wie möglich (vor jedem Rendern), damit bei
         "Hell"/"Dunkel" (im Unterschied zu "System") kein falsches Thema kurz
         aufblitzt, bevor main.tsx/theme.ts geladen sind. Muss synchron und vor
         dem CSS-Stylesheet stehen, siehe lib/theme.ts für die Laufzeit-Variante. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('loeffelbande-theme-pref')
          if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
